[package]
name = "oh-my-serial"
version = "1.0.1"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serialport = "4"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.10"
thiserror = "1"
fern = "0.6"
chrono = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
criterion = "0.5"

[features]
# 启用 ring_buffer::reset_for_bench 给 benches 使用
bench = []

[[bench]]
name = "ring_buffer_bench"
harness = false

[profile.release]
lto = true
opt-level = "z"
strip = true
