[package]
name = "oh-my-serial"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serialport = "4"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.10"
thiserror = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
opt-level = "z"
strip = true
