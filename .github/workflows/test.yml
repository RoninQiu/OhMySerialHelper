name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 单元测试 + Rust lib 测试
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 前端单元测试
        run: npm ci && npm test

      - name: Rust 单元测试 (lib 模式，不依赖硬件)
        run: cd src-tauri && cargo test --lib

      - name: Rust 检查 (clippy)
        run: cd src-tauri && cargo clippy -- -D warnings
        continue-on-error: true

      - name: 构建检查 (release)
        run: cd src-tauri && cargo build --release
