name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 单元测试 + Rust lib 测试
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `src-tauri/.cargo/config.toml` 用 sccache.exe 作 rustc-wrapper。
      # 原先手搓 `cargo install sccache --locked` + 把它塞进 actions/cache
      # 的路径列表来兜底，已经不管用了：官方 windows-latest 镜像现在**预装**
      # sccache，于是 install 必然撞上「binary already exists in destination」；
      # 而 `if: hashFiles('~/...') == ''` 里的 `~` 不会被展开，那个守卫
      # 实际上恒为真，从来没起到「cache 命中就跳过」的作用。
      # 改用官方 action：安装与缓存都交给它维护，不用自己判断。
      - name: sccache
        uses: mozilla-actions/sccache-action@v3

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 前端单元测试
        run: npm ci && npm test

      - name: 核心层单元测试 (不依赖硬件)
        run: cargo test -p oh-my-serial-core

      - name: Rust 检查 (clippy)
        run: cd src-tauri && cargo clippy -- -D warnings
        continue-on-error: true

      - name: 构建检查 (release)
        run: cd src-tauri && cargo build --release
